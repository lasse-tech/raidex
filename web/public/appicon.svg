<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Raidex app icon">
  <title>Raidex — App-Icon (Overclock, Indigo)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2340"></stop>
      <stop offset="1" stop-color="#101730"></stop>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"></rect>
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="#2D3A64" stroke-width="2"></rect>
  <g filter="url(#glow)" transform="translate(106 106) scale(12.5)">
    <path d="M12 2 L21 12 L12 22 L3 12 Z" fill="none" stroke="#22E6FF" stroke-width="1.6" stroke-linejoin="round"></path>
    <path d="M12 7 L17 12 L12 17 L7 12 Z" fill="#FF2D78"></path>
  </g>
</svg>